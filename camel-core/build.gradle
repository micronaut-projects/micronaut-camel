plugins {
    id 'io.micronaut.build.internal.camel-module'
}

dependencies {
    annotationProcessor(mn.micronaut.inject.java)
    annotationProcessor(projects.micronautCamelProcessor)

    api(mn.micronaut.context)
    api(platform(libs.boms.camel))
    api(libs.camel.main)

    compileOnly(libs.camel.endpointdsl)
    // integrations that apply when the Micronaut module is present
    compileOnly(mn.micronaut.json.core)
    compileOnly(mnCache.micronaut.cache.core)
    // the GraalVM feature, only used when building a native image
    compileOnly(mn.graalvm.nativeimage)

    // operations integrations, active only when the application adds these modules
    compileOnly(mn.micronaut.management)
    compileOnly(mnMicrometer.micronaut.micrometer.core)
    compileOnly(mnTracing.micronaut.tracing.opentelemetry)
    compileOnly(libs.camel.health)
    compileOnly(libs.camel.micrometer)
    compileOnly(libs.camel.opentelemetry2)

    // the bridges to the Micronaut messaging modules, active when both sides are on the classpath
    compileOnly(libs.camel.amqp)
    compileOnly(libs.camel.jms)
    compileOnly(libs.camel.kafka)
    compileOnly(libs.camel.nats)
    compileOnly(libs.camel.paho.mqtt5)
    compileOnly(libs.camel.sjms)
    compileOnly(libs.camel.spring.rabbitmq)
    compileOnly(mnJms.micronaut.jms.core)
    compileOnly(mnKafka.micronaut.kafka)
    compileOnly(mnRabbitmq.micronaut.rabbitmq)
    compileOnly(mnData.micronaut.data.connection.jdbc)
    compileOnly(mnData.micronaut.data.tx)

    testAnnotationProcessor(mn.micronaut.inject.java)
    testAnnotationProcessor(projects.micronautCamelProcessor)
    testImplementation(mnTest.micronaut.test.junit5)
    testImplementation(mn.graalvm.nativeimage)
    testImplementation(libs.camel.bean)
    testImplementation(libs.camel.direct)
    testImplementation(libs.camel.endpointdsl)
    testImplementation(libs.camel.health)
    testImplementation(libs.camel.jdbc)
    testImplementation(libs.camel.log)
    testImplementation(libs.camel.management)
    testImplementation(libs.camel.micrometer)
    testImplementation(libs.camel.mock)
    testImplementation(libs.camel.opentelemetry2)
    testImplementation(libs.camel.seda)
    testImplementation(libs.camel.sql)
    testImplementation(libs.camel.timer)
    testImplementation(libs.camel.yaml.dsl)
    testImplementation(libs.camel.file)
    testImplementation(mnCache.micronaut.cache.caffeine)
    testImplementation(mnSerde.micronaut.serde.jackson)
    testAnnotationProcessor(mnSerde.micronaut.serde.processor)
    testImplementation(mn.micronaut.http.client)
    testImplementation(mn.micronaut.http.server.netty)
    testImplementation(mn.micronaut.jackson.databind)
    testImplementation(mn.micronaut.management)
    testImplementation(mnMicrometer.micronaut.micrometer.core)
    testImplementation(mnTracing.micronaut.tracing.opentelemetry)
    testImplementation(libs.opentelemetry.sdk.testing)
    testImplementation(libs.camel.amqp)
    testImplementation(libs.camel.jms)
    testImplementation(libs.camel.kafka)
    testImplementation(libs.camel.nats)
    testImplementation(libs.camel.paho.mqtt5)
    testImplementation(libs.camel.sjms)
    testImplementation(libs.camel.spring.rabbitmq)
    testImplementation(mnJms.micronaut.jms.activemq.artemis)
    testImplementation(mnKafka.micronaut.kafka)
    testImplementation(mnNats.micronaut.nats)
    testImplementation(mnRabbitmq.micronaut.rabbitmq)
    testImplementation(platform(mnTest.boms.testcontainers))
    testImplementation(libs.testcontainers.activemq)
    testImplementation(libs.testcontainers.hivemq)
    testImplementation(libs.testcontainers.kafka)
    testImplementation(libs.testcontainers.rabbitmq)
    testImplementation(mnData.micronaut.data.tx.jdbc)
    testImplementation(mnSql.micronaut.jdbc.hikari)
    testRuntimeOnly(mnTest.junit.jupiter.engine)
    testRuntimeOnly(mnTest.junit.platform.launcher)
    testRuntimeOnly(mnLogging.logback.classic)
    testRuntimeOnly(mnSql.h2)
}
