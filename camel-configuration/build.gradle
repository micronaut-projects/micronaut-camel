plugins {
    id 'io.micronaut.build.internal.camel-module'
}

dependencies {
    annotationProcessor(mn.micronaut.inject.java)
    annotationProcessor(projects.micronautCamelProcessor)

    api(projects.micronautCamelCore)

    testAnnotationProcessor(mn.micronaut.inject.java)
    testImplementation(mnTest.micronaut.test.junit5)
    // the module of camel-seda, with its generated configuration
    testImplementation(projects.micronautCamelSeda)
    // the configuration validator of Micronaut JSON Schema, with the configuration schemas of the bean module
    testImplementation(mnJsonSchema.micronaut.json.schema.configuration.validator)
    testImplementation(projects.micronautCamelBean)
    testRuntimeOnly(mnTest.junit.jupiter.engine)
    testRuntimeOnly(mnTest.junit.platform.launcher)
    testRuntimeOnly(mnLogging.logback.classic)
}
