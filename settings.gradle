pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'io.micronaut.build.shared.settings' version '8.1.4'
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'camel-parent'

include 'camel-bom'
include 'camel-components'
include 'camel-core'
include 'camel-http'
include 'camel-processor'
include 'camel-test'

include 'test-suite'
include 'test-suite-graal'
include 'test-suite-groovy'
include 'test-suite-kotlin'

enableFeaturePreview 'TYPESAFE_PROJECT_ACCESSORS'

micronautBuild {
    useStandardizedProjectNames = true
    importMicronautCatalog()
    importMicronautCatalog("micronaut-servlet")
    importMicronautCatalog("micronaut-sourcegen")
    importMicronautCatalog("micronaut-cache")
    importMicronautCatalog("micronaut-serde")
    importMicronautCatalog("micronaut-micrometer")
    importMicronautCatalog("micronaut-tracing")
}
