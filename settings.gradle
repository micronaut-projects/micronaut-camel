pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    includeBuild('settings-build-logic')
    // -PupstreamBuilds=<dir>,<dir>... builds against checkouts of unreleased upstream changes (see AGENTS.md): a
    // checkout of micronaut-build provides the Gradle plugins, the others replace their published libraries below
    settings.providers.gradleProperty('upstreamBuilds').getOrElse('').split(',')*.trim().findAll().each { path ->
        if (new File(settings.settingsDir, "${path}/micronaut-gradle-plugins").directory) {
            includeBuild(path)
        }
    }
}

plugins {
    // a module per Camel extension artifact, from the Camel catalog: applied first, as the shared
    // settings plugin renames the projects
    id 'io.micronaut.build.internal.camel-extensions'
    id 'io.micronaut.build.shared.settings' version '8.1.4'
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'camel-parent'

// -PupstreamBuilds: the checkouts of the libraries, such as Micronaut core or Micronaut JSON Schema, substitute
// their published modules (see AGENTS.md)
providers.gradleProperty('upstreamBuilds').getOrElse('').split(',')*.trim().findAll().each { path ->
    File dir = new File(settingsDir, path)
    if (!dir.directory) {
        throw new GradleException("upstreamBuilds: ${dir} is not a directory")
    }
    if (!new File(dir, 'micronaut-gradle-plugins').directory) {
        // the catalogs of the included builds (mn, mnJsonSchema...) are imported while the settings are evaluated, so
        // Gradle cannot build them: generate them first (run generateCatalogAsToml in the build when its BOM changes)
        if (!(dir.listFiles() ?: []).any { new File(it, 'build/version-catalog/libs.versions.toml').file }) {
            println "upstreamBuilds: generating the version catalog of ${dir.canonicalPath}"
            providers.exec {
                workingDir(dir)
                commandLine('./gradlew', '-q', 'generateCatalogAsToml')
            }.result.get().assertNormalExitValue()
        }
        includeBuild(dir)
    }
}

include 'camel-aot'
include 'camel-bom'
include 'camel-configuration'
include 'camel-core'
include 'camel-platform-http'
include 'camel-processor'
include 'camel-servlet'
include 'camel-test'

include 'test-suite'
include 'test-suite-graal'
include 'test-suite-groovy'
include 'test-suite-kotlin'
include 'test-suite-python'

enableFeaturePreview 'TYPESAFE_PROJECT_ACCESSORS'

micronautBuild {
    useStandardizedProjectNames = true
    importMicronautCatalog()
    importMicronautCatalog("micronaut-servlet")
    importMicronautCatalog("micronaut-sourcegen")
    importMicronautCatalog("micronaut-cache")
    importMicronautCatalog("micronaut-serde")
    importMicronautCatalog("micronaut-micrometer")
    importMicronautCatalog("micronaut-tracing")
    importMicronautCatalog("micronaut-jms")
    importMicronautCatalog("micronaut-kafka")
    importMicronautCatalog("micronaut-nats")
    importMicronautCatalog("micronaut-rabbitmq")
    importMicronautCatalog("micronaut-data")
    importMicronautCatalog("micronaut-security")
    importMicronautCatalog("micronaut-redis")
    importMicronautCatalog("micronaut-validation")
    importMicronautCatalog("micronaut-object-storage")
    importMicronautCatalog("micronaut-mcp")
    importMicronautCatalog("micronaut-langchain4j")
    importMicronautCatalog("micronaut-aws")
    importMicronautCatalog("micronaut-azure")
    importMicronautCatalog("micronaut-sql")
    importMicronautCatalog("micronaut-gcp")
    importMicronautCatalog("micronaut-pulsar")
    importMicronautCatalog("micronaut-mongodb")
    importMicronautCatalog("micronaut-opensearch")
    importMicronautCatalog("micronaut-openapi")
    importMicronautCatalog("micronaut-json-schema")
}
