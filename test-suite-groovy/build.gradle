plugins {
    id 'groovy'
    id 'io.micronaut.build.internal.camel-tests'
    id 'jvm-test-suite'
}

// The JSON schema samples use camel-json-validator, whose version of the NetworkNT JSON Schema library is
// incompatible with that of the Micronaut JSON Schema validator, which micronaut-mcp brings to the other
// samples: they run in a test suite of their own, from the same sources.
def jsonSchemaSamples = 'io/micronaut/camel/docs/jsonschema/**'
sourceSets.test.groovy.exclude(jsonSchemaSamples)

dependencies {
    testCompileOnly(mn.micronaut.inject.groovy)
    testCompileOnly(projects.micronautCamelProcessor)
    testCompileOnly(mnValidation.micronaut.validation.processor)
    testImplementation(projects.micronautCamelCore)
    testImplementation(projects.micronautCamelPlatformHttp)
    testImplementation(projects.micronautCamelTest)
    testImplementation(mnData.micronaut.data.spring.jdbc)
    testImplementation(mnData.micronaut.data.tx)
    testImplementation(mnSql.micronaut.jdbc.hikari)
    testImplementation(libs.camel.bean)
    testImplementation(libs.camel.direct)
    testImplementation(libs.camel.endpointdsl)
    testImplementation(libs.camel.file)
    testImplementation(libs.camel.jackson3)
    testImplementation(libs.camel.mock)
    testImplementation(libs.camel.kafka)
    testImplementation(libs.camel.log)
    testImplementation(libs.camel.management)
    testImplementation(libs.camel.rest)
    testImplementation(libs.camel.health)
    testImplementation(libs.camel.micrometer)
    testImplementation(libs.camel.seda)
    testImplementation(libs.camel.sql)
    testImplementation(libs.camel.yaml.dsl)
    testImplementation(mn.micronaut.http.client)
    testImplementation(mn.micronaut.http.server.netty)
    testImplementation(mn.micronaut.jackson.databind)
    testImplementation(mn.micronaut.management)
    testImplementation(mnCache.micronaut.cache.caffeine)
    testImplementation(mnMicrometer.micronaut.micrometer.core)
    testImplementation(mnKafka.micronaut.kafka)
    testImplementation(platform(mnTest.boms.testcontainers))
    testImplementation(libs.testcontainers.core)
    testImplementation(libs.testcontainers.kafka)
    testImplementation(mnTest.micronaut.test.spock)
    testImplementation(mnObjectStorage.micronaut.object.storage.local)
    // Micronaut ecosystem integrations
    testImplementation(mnSecurity.micronaut.security)
    testImplementation(mnRedis.micronaut.redis.lettuce.core)
    testImplementation(libs.camel.spring.redis)
    testImplementation(mnValidation.micronaut.validation)
    testImplementation(libs.camel.bean.validator) {
        // micronaut-validation is the validator
        exclude(group: 'org.hibernate.validator')
    }
    testImplementation(mnMcp.micronaut.mcp.server.java.sdk)
    testImplementation(libs.camel.ai.tool)
    testImplementation(libs.camel.mcp.server.api)
    testRuntimeOnly(mnLogging.logback.classic)
    testRuntimeOnly(mn.micronaut.json.core)
    testRuntimeOnly(mnSql.h2)
    testRuntimeOnly(mn.snakeyaml)
}

testing {
    suites {
        jsonSchemaTest(JvmTestSuite) {
            useJUnitJupiter()
            sources {
                groovy {
                    srcDirs = ['src/test/groovy']
                    include(jsonSchemaSamples)
                }
            }
            dependencies {
                compileOnly(mn.micronaut.inject.groovy)
                compileOnly(mnJsonSchema.micronaut.json.schema.processor)
                compileOnly(mnSerde.micronaut.serde.processor)
                implementation(projects.micronautCamelCore)
                implementation(mnTest.micronaut.test.spock)
                implementation(mnJsonSchema.micronaut.json.schema.annotations)
                implementation(mnSerde.micronaut.serde.jackson)
                implementation(mnValidation.validation)
                implementation(libs.camel.direct)
                implementation(libs.camel.json.validator)
                implementation(libs.camel.mock)
                runtimeOnly(mnLogging.logback.classic)
            }
        }
    }
}

tasks.named('check') {
    dependsOn(testing.suites.jsonSchemaTest)
}
