plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    gradlePluginPortal()
    mavenCentral()
}

dependencies {
    // provides the io.micronaut.build.internal.kotlin-ksp plugin of test-suite-kotlin
    implementation(providers.gradleProperty("micronaut-build-version").map { "io.micronaut.build.internal:micronaut-kotlin-build-plugins:${it}" }.get())
    // provides the io.micronaut.test-resources plugin of test-suite-graal
    implementation("io.micronaut.gradle:micronaut-test-resources-plugin:5.0.2")
}
