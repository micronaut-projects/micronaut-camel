micronaut:
  executors:
    # Camel runs the requests of platform-http routes, and so Python processors, on the blocking executor:
    # GraalPy does not run Python code on virtual threads
    io:
      type: cached
      virtual: false
    blocking:
      type: cached
      virtual: false
  security:
    # enabled by the docs-security environment of micronaut.camel.docs.integrations.AdminRoutesTest
    enabled: false
  object-storage:
    local:
      # the object storage of micronaut.camel.docs.integrations.DocumentRoutes
      documents:
        path: build/tmp/docs-documents
  caches:
    # the idempotent repository of micronaut.camel.docs.integrations.IntegrationRoutes
    imports:
      maximum-size: 1000
    # the aggregation repository of micronaut.camel.docs.integrations.BasketRepositories
    baskets:
      maximum-size: 1000
# The database of the guide samples about transactions
datasources:
  default:
    url: "jdbc:h2:mem:docs;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:transactions/schema.sql'"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    # Micronaut transactions run on Spring's DataSourceTransactionManager, which camel-sql joins
    transaction-manager: springJdbc
