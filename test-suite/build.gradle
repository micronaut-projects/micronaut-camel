    testImplementation(mn.reactor)
    testImplementation(libs.camel.resilience4j)
    components {
        // micronaut-cache-infinispan pins jackson-core strictly to an older version than the other modules require
        withModule('io.micronaut.cache:micronaut-cache-infinispan') {
            allVariants {
                withDependencyConstraints {
                    removeAll { it.group == 'com.fasterxml.jackson.core' }
                }
            }
        }
    }
    // the services of the examples
    testImplementation(libs.testcontainers.core)
    testImplementation(libs.testcontainers.qdrant)
    testImplementation(libs.testcontainers.vault)
    testRuntimeOnly(mnLogging.logback.classic)
    testRuntimeOnly(mn.micronaut.json.core)
    testRuntimeOnly(mnSql.h2)
    testRuntimeOnly(mn.snakeyaml)
}

testing {
    suites {
        // Camel's OpenAPI document of the REST DSL in the Swagger UI of micronaut-openapi, whose annotation
        // processor would otherwise process every test class of the suite
        openapiTest(JvmTestSuite) {
            useJUnitJupiter()
            dependencies {
                annotationProcessor(mn.micronaut.inject.java)
                annotationProcessor(mnOpenapi.micronaut.openapi)
                compileOnly(mnOpenapi.micronaut.openapi.annotations)
                implementation(projects.micronautCamelCore)
                implementation(projects.micronautCamelPlatformHttp)
                implementation(libs.camel.openapi.java)
                implementation(libs.camel.rest)
                implementation(mn.micronaut.http.client)
                implementation(mn.micronaut.http.server.netty)
                implementation(mnTest.micronaut.test.junit5)
                runtimeOnly(mnLogging.logback.classic)
                runtimeOnly(mn.micronaut.jackson.databind)
                runtimeOnly(mn.snakeyaml)
            }
            targets.configureEach {
                testTask.configure {
                    useJUnitPlatform()
                }
            }
        }
    }
}

tasks.named('compileOpenapiTestJava', JavaCompile) {
    // the Swagger UI of micronaut-openapi shows the OpenAPI document that Camel serves
    options.compilerArgs.add('-Amicronaut.openapi.views.spec=swagger-ui.enabled=true,swagger-ui.spec.url=/api/api-doc')
}

tasks.named('check') {
    dependsOn(testing.suites.openapiTest)
}
