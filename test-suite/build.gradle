    testRuntimeOnly(mnSql.postgresql)
    // the examples of the integration patterns and services
    testImplementation(libs.camel.arangodb)
    // the ArangoDB driver brings Jackson's JSON-P module, which Jackson loads, but no JSON-P implementation
    testRuntimeOnly(mnSerde.eclipse.parsson)
    testImplementation(libs.camel.docling)
    testImplementation(libs.camel.hl7)
    testImplementation(libs.hapi.structures.v24)
