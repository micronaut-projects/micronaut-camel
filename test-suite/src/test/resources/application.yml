micronaut:
  caches:
    # the idempotent repository of io.micronaut.camel.docs.integrations.IntegrationRoutes
    imports:
      maximum-size: 1000
  executors:
    # micronaut-kafka, micronaut-nats and micronaut-rabbitmq each declare a "consumer" executor:
    # configuring it explicitly makes it unique when all of them are on the test classpath
    consumer:
      type: fixed
endpoints:
  health:
    rabbitmq:
      # most tests have no RabbitMQ broker
      enabled: false
# The database of the guide samples about transactions
datasources:
  default:
    url: "jdbc:h2:mem:docs;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:transactions/schema.sql'"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    # Micronaut transactions run on Spring's DataSourceTransactionManager, which camel-sql joins
    transaction-manager: springJdbc
