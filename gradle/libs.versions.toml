#
# This file is used to declare the list of libraries
# which are used as dependencies in the project.
# See https://docs.gradle.org/7.4.2/userguide/platforms.html#sub:central-declaration-of-dependencies
#
# For Micronaut, we have 3 kinds of dependencies:
#   - managed dependencies, which are exposed to consumers via a BOM (or version catalog)
#   - managed BOMs, which are imported into the BOM that we generate
#   - all other dependencies, which are implementation details
#
# If a library needs to appear in the BOM of the project, then it must be
# declared with the "managed-" prefix.
# If a BOM needs to be imported in the BOM of the project, then it must be
# declared with the "boms-" prefix.
# Both managed dependencies and BOMs need to have their version declared via
# a managed version (a version which alias starts with "managed-"

[versions]
micronaut = "5.2.15"
micronaut-docs = "3.0.0"
micronaut-test = "5.2.0"
micronaut-logging = "2.1.0"
micronaut-servlet = "6.2.2"
micronaut-sourcegen = "2.2.3"
micronaut-cache = "6.1.1"
micronaut-serde = "3.2.4"
groovy = "4.0.24"
spock = "2.3-groovy-4.0"

# Managed versions appear in the BOM
managed-camel = "4.22.1"

[libraries]
# Core
micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }
micronaut-logging = { module = "io.micronaut.logging:micronaut-logging-bom", version.ref = "micronaut-logging" }
micronaut-servlet = { module = "io.micronaut.servlet:micronaut-servlet-bom", version.ref = "micronaut-servlet" }
micronaut-sourcegen = { module = "io.micronaut.sourcegen:micronaut-sourcegen-bom", version.ref = "micronaut-sourcegen" }
micronaut-cache = { module = "io.micronaut.cache:micronaut-cache-bom", version.ref = "micronaut-cache" }
micronaut-serde = { module = "io.micronaut.serde:micronaut-serde-bom", version.ref = "micronaut-serde" }

#
# Managed dependencies appear in the BOM
#
# managed-somelib = { module = "group:artifact", version.ref = "managed-somelib" }

#
# Imported BOMs, also appearing in the generated BOM
#
boms-camel = { module = "org.apache.camel:camel-bom", version.ref = "managed-camel" }

# Other libraries used by the project but non managed

# Versions from boms-camel
camel-main = { module = "org.apache.camel:camel-main" }
camel-bean = { module = "org.apache.camel:camel-bean" }
camel-catalog = { module = "org.apache.camel:camel-catalog" }
camel-csv = { module = "org.apache.camel:camel-csv" }
camel-direct = { module = "org.apache.camel:camel-direct" }
camel-endpointdsl = { module = "org.apache.camel:camel-endpointdsl" }
camel-fhir = { module = "org.apache.camel:camel-fhir" }
camel-file = { module = "org.apache.camel:camel-file" }
camel-groovy = { module = "org.apache.camel:camel-groovy" }
camel-http = { module = "org.apache.camel:camel-http" }
camel-jackson = { module = "org.apache.camel:camel-jackson" }
camel-jackson3 = { module = "org.apache.camel:camel-jackson3" }
camel-log = { module = "org.apache.camel:camel-log" }
camel-mock = { module = "org.apache.camel:camel-mock" }
camel-openapi-java = { module = "org.apache.camel:camel-openapi-java" }
camel-openapi-validator = { module = "org.apache.camel:camel-openapi-validator" }
camel-platform-http = { module = "org.apache.camel:camel-platform-http" }
camel-quartz = { module = "org.apache.camel:camel-quartz" }
camel-rest = { module = "org.apache.camel:camel-rest" }
camel-rest-openapi = { module = "org.apache.camel:camel-rest-openapi" }
camel-seda = { module = "org.apache.camel:camel-seda" }
camel-stream = { module = "org.apache.camel:camel-stream" }
camel-timer = { module = "org.apache.camel:camel-timer" }
camel-undertow = { module = "org.apache.camel:camel-undertow" }
camel-yaml-dsl = { module = "org.apache.camel:camel-yaml-dsl" }

[bundles]

[plugins]
